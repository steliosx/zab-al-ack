name: Public dependency and secret checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the pinned advisory scanner with hash verification
        run: python -m pip install --require-hashes -r requirements-scanner.lock
      - name: Build pinned public scanner with the hosted runner's Go toolchain
        # Commit of tag v8.24.3; see docs/gitleaks_reference_manifest.json.
        # Upstream cmd/version.go requires the linker value used by .goreleaser.yml.
        run: >-
          go install
          -ldflags=-X=github.com/zricethezav/gitleaks/v8/cmd.Version=8.24.3
          github.com/zricethezav/gitleaks/v8@107a41827bb6698dbbff756b2300537774a1d84c
      - run: '"$(go env GOPATH)/bin/gitleaks" version | grep -x 8.24.3'
      - name: Scan dependency lock, public export and public Git history
        run: python tools/security_scan.py --public-advisory-lookups --gitleaks "$(go env GOPATH)/bin/gitleaks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: public-security-summary
          path: |
            evidence/security-scans.json
            evidence/pip-audit.json
          if-no-files-found: error
