name: Public dependency and secret checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Refuse an untrusted revision on the persistent runner
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          # Defence in depth, not the trust boundary: a pull request can edit
          # this file, so this cannot be the whole control. The boundary is
          # repository access, recorded in docs/self-hosted-runner.md. What this
          # does add is that an unmodified pull request from outside this
          # repository stops here, before any checkout, and so never reaches the
          # runner account's root-equivalent Docker access, its retained private
          # attempts or its installed hooks.
          test "$EVENT" != pull_request || test "$HEAD_REPO" = "$THIS_REPO"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Create a fresh job environment
        run: |
          test ! -e "$RUNNER_TEMP/venv"
          python -m venv "$RUNNER_TEMP/venv"
          printf '%s\n' "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install the pinned advisory scanner with hash verification
        run: python -m pip install --require-hashes -r requirements-scanner.lock
      - name: Install the pinned Linux x64 public scanner
        # Official v8.24.3 release for commit 107a41827bb6698dbbff756b2300537774a1d84c.
        # Hash inspected in upstream gitleaks_8.24.3_checksums.txt; see ci-evidence.md.
        run: |
          test "$(uname -m)" = x86_64
          mkdir "$RUNNER_TEMP/gitleaks"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks/archive.tar.gz"
          printf '%s  %s\n' 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c "$RUNNER_TEMP/gitleaks/archive.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks/archive.tar.gz" --directory "$RUNNER_TEMP/gitleaks" --no-same-owner gitleaks
      - run: '"$RUNNER_TEMP/gitleaks/gitleaks" version | grep -x 8.24.3'
      - name: Scan dependency lock, public export and public Git history
        run: python tools/security_scan.py --public-advisory-lookups --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: public-security-summary
          path: |
            evidence/security-scans.json
            evidence/pip-audit.json
          if-no-files-found: error
          retention-days: 3
