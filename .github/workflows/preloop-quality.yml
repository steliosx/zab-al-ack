name: Preloop local quality

# Zabalack quality job for the Preloop v0.33.9 engine pilot (owner decisions 2026-10-09). The job below is ci.yml's
# `quality` job at 3fb266d, byte for byte except `runs-on` (the local Preloop pool's X64 Ubuntu 24.04 microVM instead of
# the ARM64 self-hosted runner) and the three action pins, moved to their Node 24 releases (Node 20 actions are refused
# since 2026-09-23). The evidence-bundling steps (collect_ci_evidence.py prepare/pack and upload-artifact) are omitted:
# Preloop v0.33.9 sets github.run_id to a UUID and run_attempt to 1, and the bundler requires GitHub's numeric run
# identifiers ("Invalid run context" in the local pilot, check 114112250997). The quality commands are unchanged.
# Started only by a manual dispatch to the local Preloop engine; the engine posts the
# result as a check run. GitHub's own Actions never run it (dispatch-only, not on the default branch).
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  TZ: UTC
concurrency:
  group: preloop-local-quality
  cancel-in-progress: false
jobs:
  quality:
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 15
    steps:
      - name: Refuse an untrusted revision on the persistent runner
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          # Defence in depth, not the trust boundary: a pull request can edit
          # this file, so this cannot be the whole control. The boundary is
          # repository access, recorded in docs/self-hosted-runner.md. What this
          # does add is that an unmodified pull request from outside this
          # repository stops here, before any checkout, and so never reaches the
          # runner account's root-equivalent Docker access, its retained private
          # attempts or its installed hooks.
          test "$EVENT" != pull_request || test "$HEAD_REPO" = "$THIS_REPO"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (node24)
        with:
          python-version: '3.12'
      - name: Create a fresh job environment
        run: |
          test ! -e "$RUNNER_TEMP/venv"
          python -m venv "$RUNNER_TEMP/venv"
          printf '%s\n' "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --require-hashes -r requirements-quality.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python tools/run_quality.py
      - name: Retain fresh alpha quality report in the job log
        run: python -m json.tool evidence/quality-run.json
