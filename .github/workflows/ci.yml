name: Alpha reference checks
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: read
env:
  TZ: UTC
  ACK_HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'nightly' || 'pr' }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Refuse an untrusted revision on the persistent runner
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          # Defence in depth, not the trust boundary: a pull request can edit
          # this file, so this cannot be the whole control. The boundary is
          # repository access, recorded in docs/self-hosted-runner.md. What this
          # does add is that an unmodified pull request from outside this
          # repository stops here, before any checkout, and so never reaches the
          # runner account's root-equivalent Docker access, its retained private
          # attempts or its installed hooks.
          test "$EVENT" != pull_request || test "$HEAD_REPO" = "$THIS_REPO"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Create a fresh job environment
        run: |
          test ! -e "$RUNNER_TEMP/venv"
          python -m venv "$RUNNER_TEMP/venv"
          printf '%s\n' "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python tools/collect_ci_evidence.py prepare --kind quality
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --require-hashes -r requirements-quality.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python tools/run_quality.py
      - run: python tools/collect_ci_evidence.py pack --kind quality
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zabalack-evidence-${{ github.run_id }}-${{ github.run_attempt }}-quality
          path: build/ci-artifacts/quality/
          if-no-files-found: error
          retention-days: 3
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Refuse an untrusted revision on the persistent runner
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          # Defence in depth, not the trust boundary: a pull request can edit
          # this file, so this cannot be the whole control. The boundary is
          # repository access, recorded in docs/self-hosted-runner.md. What this
          # does add is that an unmodified pull request from outside this
          # repository stops here, before any checkout, and so never reaches the
          # runner account's root-equivalent Docker access, its retained private
          # attempts or its installed hooks.
          test "$EVENT" != pull_request || test "$HEAD_REPO" = "$THIS_REPO"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Create a fresh job environment
        run: |
          test ! -e "$RUNNER_TEMP/venv"
          python -m venv "$RUNNER_TEMP/venv"
          printf '%s\n' "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python tools/collect_ci_evidence.py prepare --kind mutation
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --require-hashes -r requirements-quality.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python tools/run_mutation_checks.py --profile "${ACK_HYPOTHESIS_PROFILE}"
      - run: python tools/collect_ci_evidence.py pack --kind mutation
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zabalack-evidence-${{ github.run_id }}-${{ github.run_attempt }}-mutation
          path: build/ci-artifacts/mutation/
          if-no-files-found: error
          retention-days: 3
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Refuse an untrusted revision on the persistent runner
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          # Defence in depth, not the trust boundary: a pull request can edit
          # this file, so this cannot be the whole control. The boundary is
          # repository access, recorded in docs/self-hosted-runner.md. What this
          # does add is that an unmodified pull request from outside this
          # repository stops here, before any checkout, and so never reaches the
          # runner account's root-equivalent Docker access, its retained private
          # attempts or its installed hooks.
          test "$EVENT" != pull_request || test "$HEAD_REPO" = "$THIS_REPO"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Create a fresh job environment
        run: |
          test ! -e "$RUNNER_TEMP/venv"
          python -m venv "$RUNNER_TEMP/venv"
          printf '%s\n' "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - run: python tools/collect_ci_evidence.py prepare --kind reference
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --require-hashes -r requirements-quality.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: npm ci --prefix lab --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: node zabbix/v1/test_webhook.cjs
      - run: python tools/run_sql_checks.py --isolated-lab
      - run: python tools/run_reference_suite.py --wasm
      - run: python tools/collect_ci_evidence.py pack --kind reference
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zabalack-evidence-${{ github.run_id }}-${{ github.run_attempt }}-reference
          path: build/ci-artifacts/reference/
          if-no-files-found: error
          retention-days: 3
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Refuse an untrusted revision on the persistent runner
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          # Defence in depth, not the trust boundary: a pull request can edit
          # this file, so this cannot be the whole control. The boundary is
          # repository access, recorded in docs/self-hosted-runner.md. What this
          # does add is that an unmodified pull request from outside this
          # repository stops here, before any checkout, and so never reaches the
          # runner account's root-equivalent Docker access, its retained private
          # attempts or its installed hooks.
          test "$EVENT" != pull_request || test "$HEAD_REPO" = "$THIS_REPO"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Create a fresh job environment
        run: |
          test ! -e "$RUNNER_TEMP/venv"
          python -m venv "$RUNNER_TEMP/venv"
          printf '%s\n' "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python tools/collect_ci_evidence.py prepare --kind native
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --require-hashes -r requirements-quality.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: flock -n "$HOME/zabalack-shared-linux-lab.lock" python tools/native_ci.py --isolated-lab --retire-empty-networks --network-evidence-root "$HOME/zabalack-native-networks"
      - run: python tools/collect_ci_evidence.py pack --kind native
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zabalack-evidence-${{ github.run_id }}-${{ github.run_attempt }}-native
          path: build/ci-artifacts/native/
          if-no-files-found: error
          retention-days: 3
      - run: python tools/native_failure_summary.py
        if: always()
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: zabalack-native-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/native-failure-summary.json
          if-no-files-found: error
          retention-days: 3
  package:
    needs: [quality, reference, native, mutation]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Refuse an untrusted revision on the persistent runner
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          # Defence in depth, not the trust boundary: a pull request can edit
          # this file, so this cannot be the whole control. The boundary is
          # repository access, recorded in docs/self-hosted-runner.md. What this
          # does add is that an unmodified pull request from outside this
          # repository stops here, before any checkout, and so never reaches the
          # runner account's root-equivalent Docker access, its retained private
          # attempts or its installed hooks.
          test "$EVENT" != pull_request || test "$HEAD_REPO" = "$THIS_REPO"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Create a fresh job environment
        run: |
          test ! -e "$RUNNER_TEMP/venv"
          python -m venv "$RUNNER_TEMP/venv"
          printf '%s\n' "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --require-hashes -r requirements-quality.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      # No token or cross-run inputs: downloads are scoped to this workflow run.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: zabalack-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: build/ci-download/
          merge-multiple: false
      - run: python tools/collect_ci_evidence.py collect --input build/ci-download
      - run: python tools/update_acceptance.py
      - run: python tools/dependency_inventory.py
      - run: python tools/public_audit.py --write-report
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zabalack-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            dist/
          if-no-files-found: error
          retention-days: 3
