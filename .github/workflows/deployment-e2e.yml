name: Isolated deployment E2E
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  TZ: UTC
jobs:
  service-lab:
    # Review the repository's self-hosted lab policy before explicit enablement.
    if: ${{ vars.ZABALACK_DEPLOYMENT_E2E_ENABLED == 'true' }}
    runs-on: [self-hosted, Linux, ARM64, zabalack]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Create a fresh job environment
        run: |
          test ! -e "$RUNNER_TEMP/venv"
          python -m venv "$RUNNER_TEMP/venv"
          printf '%s\n' "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: flock -n /home/codex/zabalack-task-runs/shared-linux-lab.lock python tools/run_deployment_e2e.py --isolated-lab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: zabalack-deployment-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/deployment-e2e-run.json
          if-no-files-found: error
          retention-days: 3
