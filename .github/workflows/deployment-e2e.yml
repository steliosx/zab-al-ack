name: Isolated deployment E2E
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Run ID of the "Alpha reference checks" run whose package job produced the candidate wheel'
        required: true
        type: string
      candidate_revision:
        description: 'Full 40-hex commit that run built; this job must be dispatched on that same revision'
        required: true
        type: string
      wheel_sha256:
        description: 'Expected SHA-256 of that run''s dist/pypi/zabalack-<version>-py3-none-any.whl (64 hex)'
        required: true
        type: string
permissions:
  contents: read
  # Reads the candidate artifact of another run of this repository; nothing is written.
  actions: read
env:
  TZ: UTC
jobs:
  service-lab:
    # Review the repository's self-hosted lab policy before explicit enablement.
    if: ${{ vars.ZABALACK_DEPLOYMENT_E2E_ENABLED == 'true' }}
    runs-on: [self-hosted, Linux, X64, zabalack]
    timeout-minutes: 45
    steps:
      - name: Refuse an untrusted revision on the persistent runner
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          # Defence in depth, not the trust boundary: a pull request can edit
          # this file, so this cannot be the whole control. The boundary is
          # repository access, recorded in docs/self-hosted-runner.md. What this
          # does add is that an unmodified pull request from outside this
          # repository stops here, before any checkout, and so never reaches the
          # runner account's root-equivalent Docker access, its retained private
          # attempts or its installed hooks.
          test "$EVENT" != pull_request || test "$HEAD_REPO" = "$THIS_REPO"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Create a fresh job environment
        run: |
          test ! -e "$RUNNER_TEMP/venv"
          python -m venv "$RUNNER_TEMP/venv"
          printf '%s\n' "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - name: Bind this job to the candidate revision and the supplied wheel digest
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
        run: |
          # The wheel under qualification is the one the candidate's package job
          # already produced, never a build of this job. The inputs name that
          # run, the revision it built and the wheel's digest; this checkout
          # must be that revision, or the preflight's payload comparison would
          # prove nothing about the candidate.
          printf '%s' "$CANDIDATE_RUN_ID" | grep -Eq '^[0-9]{1,20}$'
          printf '%s' "$CANDIDATE_REVISION" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$WHEEL_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_REVISION"
      - name: Confirm the candidate run is a successful run of this revision
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
        run: |
          curl -sSf -H "Authorization: Bearer $ACTIONS_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API_URL/repos/$REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > "$RUNNER_TEMP/candidate-run.json"
          python - "$RUNNER_TEMP/candidate-run.json" "$CANDIDATE_REVISION" "$REPOSITORY" <<'PY'
          import json, sys
          run = json.load(open(sys.argv[1]))
          assert run["head_sha"] == sys.argv[2], "the candidate run built another revision"
          assert run["repository"]["full_name"] == sys.argv[3], "the candidate run belongs to another repository"
          assert run["conclusion"] == "success", "the candidate run did not succeed: " + str(run["conclusion"])
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # The candidate artifact of that run (ci.yml package job), by name pattern; no build here.
          pattern: zabalack-candidate-${{ inputs.candidate_run_id }}-*
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: false
      - name: Verify the candidate wheel's digest before anything installs it
        env:
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
        run: |
          test ! -e "$RUNNER_TEMP/dist"
          test "$(ls -d "$RUNNER_TEMP"/candidate/zabalack-candidate-*/ | wc -l)" = 1
          test "$(ls "$RUNNER_TEMP"/candidate/zabalack-candidate-*/dist/pypi/zabalack-*-py3-none-any.whl | wc -l)" = 1
          WHEEL="$(ls "$RUNNER_TEMP"/candidate/zabalack-candidate-*/dist/pypi/zabalack-*-py3-none-any.whl)"
          printf '%s  %s\n' "$WHEEL_SHA256" "$WHEEL" | sha256sum -c --strict -
          mkdir "$RUNNER_TEMP/dist"
          cp "$WHEEL" "$RUNNER_TEMP/dist/"
          test "$(ls "$RUNNER_TEMP"/dist/zabalack-*-py3-none-any.whl | wc -l)" = 1
      - name: Prepare the runner environment from the candidate wheel only
        run: |
          test ! -e "$RUNNER_TEMP/e2e-runner"
          python lab/deployment_native_lab.py prepare-runner --isolated-lab --wheel "$RUNNER_TEMP"/dist/zabalack-*-py3-none-any.whl --venv "$RUNNER_TEMP/e2e-runner"
      - name: Deployment path on the runner's installed services (no Docker)
        env:
          # Reviewed package paths (lab/native_service_identities.json, lab/zabbix_reference.json); no Docker.
          ACK_LAB_PG_BIN: /usr/lib/postgresql/18/bin
          ZABALACK_ZABBIX_SERVER: /usr/sbin/zabbix_server
          ZABALACK_ZABBIX_UI: /usr/share/zabbix
          ZABALACK_ZABBIX_SCHEMA: /usr/share/zabbix-sql-scripts/postgresql/server.sql.gz
          ZABALACK_PHP: /usr/bin/php8.3
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
        run: |
          # One invocation under the shared host lab lock: start, run, stop, wipe.
          # The digest is the supplied candidate digest, verified above; the
          # preflight it enables proves the wheel payload equals this checkout and
          # every installed file equals the wheel (tools/supplied_wheel.py).
          WHEEL="$(ls "$RUNNER_TEMP"/dist/zabalack-*-py3-none-any.whl)"
          flock -n /home/codex/zabalack-task-runs/shared-linux-lab.lock python lab/deployment_native_lab.py cycle --isolated-lab --runner-python "$RUNNER_TEMP/e2e-runner/bin/python" --wheel "$WHEEL" --wheel-sha256 "$WHEEL_SHA256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: zabalack-deployment-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/deployment-e2e-run.json
          if-no-files-found: error
          retention-days: 3
