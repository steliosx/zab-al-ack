name: Isolated deployment E2E
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  TZ: UTC
jobs:
  service-lab:
    # Review the repository's self-hosted lab policy before explicit enablement.
    if: ${{ vars.ZABALACK_DEPLOYMENT_E2E_ENABLED == 'true' }}
    runs-on: [self-hosted, Linux, X64, zabalack]
    timeout-minutes: 45
    steps:
      - name: Refuse an untrusted revision on the persistent runner
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          # Defence in depth, not the trust boundary: a pull request can edit
          # this file, so this cannot be the whole control. The boundary is
          # repository access, recorded in docs/self-hosted-runner.md. What this
          # does add is that an unmodified pull request from outside this
          # repository stops here, before any checkout, and so never reaches the
          # runner account's root-equivalent Docker access, its retained private
          # attempts or its installed hooks.
          test "$EVENT" != pull_request || test "$HEAD_REPO" = "$THIS_REPO"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Create a fresh job environment
        run: |
          test ! -e "$RUNNER_TEMP/venv"
          python -m venv "$RUNNER_TEMP/venv"
          printf '%s\n' "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - name: Build the one wheel this job installs
        run: |
          test ! -e "$RUNNER_TEMP/dist"
          python -m build --no-isolation --wheel --outdir "$RUNNER_TEMP/dist"
          test "$(ls "$RUNNER_TEMP"/dist/zabalack-*-py3-none-any.whl | wc -l)" = 1
      - name: Prepare the runner environment from the built wheel only
        run: |
          test ! -e "$RUNNER_TEMP/e2e-runner"
          python lab/deployment_native_lab.py prepare-runner --isolated-lab --wheel "$RUNNER_TEMP"/dist/zabalack-*-py3-none-any.whl --venv "$RUNNER_TEMP/e2e-runner"
      - name: Deployment path on the runner's installed services (no Docker)
        env:
          # Reviewed package paths (lab/native_service_identities.json, lab/zabbix_reference.json); no Docker.
          ACK_LAB_PG_BIN: /usr/lib/postgresql/18/bin
          ZABALACK_ZABBIX_SERVER: /usr/sbin/zabbix_server
          ZABALACK_ZABBIX_UI: /usr/share/zabbix
          ZABALACK_ZABBIX_SCHEMA: /usr/share/zabbix-sql-scripts/postgresql/server.sql.gz
          ZABALACK_PHP: /usr/bin/php8.3
        run: |
          # One invocation under the shared host lab lock: start, run, stop, wipe.
          # The digest is this job's own build; the preflight it enables proves the
          # wheel payload equals this checkout and the installed bytes equal the wheel.
          WHEEL="$(ls "$RUNNER_TEMP"/dist/zabalack-*-py3-none-any.whl)"
          flock -n /home/codex/zabalack-task-runs/shared-linux-lab.lock python lab/deployment_native_lab.py cycle --isolated-lab --runner-python "$RUNNER_TEMP/e2e-runner/bin/python" --wheel "$WHEEL" --wheel-sha256 "$(sha256sum "$WHEEL" | cut -d' ' -f1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: zabalack-deployment-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/deployment-e2e-run.json
          if-no-files-found: error
          retention-days: 3
