# Forgehold lane Docker probe: does the guest have a usable Docker daemon? Observation only; no repository checkout.
# Dispatch only (the Forgehold queue sends exactly one dispatch); pushing this file starts nothing.
# Prints PROBE_DOCKER lines; the job ends 0 whatever Docker's state is, so the markers carry the result.
# Copy this file byte-for-byte; do not edit it (the queue pins its sha256).
name: forgehold-probe-docker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forgehold-probe-docker
  cancel-in-progress: false

jobs:
  docker:
    runs-on: [self-hosted, Linux, X64, forgehold]
    timeout-minutes: 4
    steps:
      - name: Docker probe
        run: |
          python3 -I - <<'PY'
          import json, shutil, subprocess
          def emit(d): print("PROBE_DOCKER " + json.dumps(d, sort_keys=True, separators=(",", ":")), flush=True)
          def run(args, t):
              try:
                  r = subprocess.run(args, capture_output=True, text=True, timeout=t)
                  return r.returncode, (r.stdout or "") + (r.stderr or "")
              except FileNotFoundError:
                  return None, "not found"
              except subprocess.TimeoutExpired:
                  return None, "timeout"
          if not shutil.which("docker"):
              emit({"probe": "cli", "present": False})
          else:
              rc, out = run(["docker", "--version"], 20)
              emit({"probe": "cli", "present": True, "rc": rc, "version": out.strip().splitlines()[0][:120] if out.strip() else ""})
              rc, out = run(["docker", "version", "--format", "{{.Server.Version}}"], 30)
              emit({"probe": "daemon", "reachable": rc == 0, "rc": rc, "server_version": out.strip()[:60] if rc == 0 else "", "error": "" if rc == 0 else out.strip().splitlines()[-1][:160] if out.strip() else ""})
              rc, out = run(["docker", "run", "--rm", "hello-world"], 120)
              emit({"probe": "hello_world", "rc": rc, "hello_line": "Hello from Docker!" in out, "tail": "" if rc == 0 else out.strip().splitlines()[-1][:160] if out.strip() else ""})
              rc, out = run(["docker", "compose", "version"], 20)
              emit({"probe": "compose_v2", "rc": rc, "version": out.strip().splitlines()[0][:120] if rc == 0 and out.strip() else ""})
          emit({"probe": "done", "result": "PASS"})
          PY
