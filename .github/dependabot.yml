version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Covers the pyproject.toml runtime pins only. requirements.lock,
  # requirements-runtime.lock and requirements-scanner.lock are not names
  # Dependabot's pip support reads; refresh them by hand (CONTRIBUTING.md).
  # `pip check` does not see extras or build-system requirements, so
  # tests/release/test_pin_consistency.py fails the reference job until every
  # pyproject pin is repeated in the locks and every action commit is inspected.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /lab
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
