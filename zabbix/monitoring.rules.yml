# Reference Prometheus expressions for the existing monitoring system.
# No scrape target, notification receiver, or scheduled job is enabled here.
# The metric names are those of `zabalack metrics` (metrics.prometheus_text).
groups:
  - name: zabalack_reference
    rules:
      - alert: AlertaZabbixAckPending
        expr: max by (instance) (zabalack_oldest_pending_seconds) > 120
        for: 1m
        labels: {severity: warning, failure_class: pending_age}
        annotations: {summary: "Zabbix acknowledgement delivery pending"}
      - alert: AlertaZabbixAckPendingCritical
        expr: max by (instance) (zabalack_oldest_pending_seconds) > 300
        labels: {severity: critical, failure_class: pending_age}
        annotations: {summary: "Zabbix acknowledgement queue requires an owner"}
      - alert: AlertaZabbixAckCredentialOrPermission
        expr: max by (instance, failure_class) (zabalack_instance_failure{failure_class=~"credential|credential_expiry_metadata|permission|capture_health|verifier_key"}) > 0
        labels: {severity: critical}
        annotations: {summary: "Acknowledgement integration blocked for this instance"}
      # Runbook token policy: 90-day expiry, rotation before day 60 (30 days left).
      - alert: AlertaZabbixAckCredentialExpiring
        # Positive only: an expired token raises the critical rule alone.
        expr: (min by (instance) (zabalack_credential_expiry_seconds) < 2592000) and (min by (instance) (zabalack_credential_expiry_seconds) > 0)
        labels: {severity: warning, failure_class: credential_expiry}
        annotations: {summary: "Zabbix API token is inside its rotation window"}
      - alert: AlertaZabbixAckCredentialExpired
        expr: min by (instance) (zabalack_credential_expiry_seconds) <= 0
        labels: {severity: critical, failure_class: credential_expiry}
        annotations: {summary: "Zabbix API token is past its declared expiry"}
# Notification grouping: instance + failure_class. Do not group by action,
# capture, alert, event, actor or token; keep a single incident per failure.
# Backup owner at 10 minutes; duty-manager escalation remains G7 configuration.
