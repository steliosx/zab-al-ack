---
- name: Apply only Zab-al-ack-owned database objects using a reviewed connection
  hosts: "{{ zabalack_database_group | default('__zabalack_no_hosts_selected__') }}"
  gather_facts: false
  serial: 1
  vars:
    zabalack_migrations_opt_in: false
  pre_tasks:
    - ansible.builtin.assert:
        that:
          - zabalack_migrations_opt_in | bool
          - zabalack_database_group is defined
          - zabalack_change_ref | default('') | length > 0
          - zabalack_paths_fenced | default(false) | bool
          - zabalack_migration_script is defined
          - zabalack_migration_python is defined
          - zabalack_migration_service is defined
          - zabalack_application_role is defined
          - zabalack_application_grant_script is defined
        fail_msg: "Explicit fenced migration selection, reviewed zabalack_owner command and the application role required."
  tasks:
    - name: Run checksummed migration CLI under its own restricted principal
      ansible.builtin.command:
        argv: ["{{ zabalack_migration_python }}", "{{ zabalack_migration_script }}", --dsn-env, ZABALACK_MIGRATION_DSN, --set-role, zabalack_owner]
      environment:
        ZABALACK_MIGRATION_DSN: "service={{ zabalack_migration_service }}"
      no_log: true
    - name: Grant the application role its single entry point (A5 stage two), as the schema owner
      ansible.builtin.command:
        argv: [psql, -X, --no-password, --set, ON_ERROR_STOP=1, --dbname, "service={{ zabalack_migration_service }}",
               --set, "alert_app_role={{ zabalack_application_role }}", --command, "SET ROLE zabalack_owner",
               --file, "{{ zabalack_application_grant_script }}"]
      no_log: true
# zabalack_migration_script selects the reviewed sql/migrate.py in this artifact.
# The CLI enforces zabalack_owner. Do not put the trigger installer DSN here.
# No role creation, alerts ownership change, trigger administration or restart.
# zabalack_application_grant_script must be the reviewed sql/install/12_application_grant.sql artifact and
# zabalack_application_role the role the Alerta application connects as. The grant changes ACLs the readiness
# manifest hashes, so it runs here, before 03_trigger_install.yml seals a fresh installation; an already-sealed
# installation is re-sealed by 04_reseal.yml afterwards instead.

