---
- name: Install reviewed package and inert worker configuration
  hosts: "{{ zabalack_target_group | default('__zabalack_no_hosts_selected__') }}"
  gather_facts: false
  serial: 1
  become: true
  vars:
    zabalack_install_opt_in: false
    zabalack_python: /usr/bin/python3
    zabalack_root: /opt/zabalack
    zabalack_runtime_user: zabalack
  pre_tasks:
    - name: Require explicit reviewed target and change context
      ansible.builtin.assert:
        that:
          - zabalack_install_opt_in | bool
          - zabalack_target_group is defined
          - zabalack_change_ref | default('') | length > 0
          - zabalack_wheel_file is defined
          - zabalack_wheel_sha256 is match('^[a-f0-9]{64}$')
          - zabalack_wheelhouse is defined
          - zabalack_runtime_lockfile is defined
          - zabalack_shadow_config is defined
          - not (zabalack_shadow_config.external_writes_enabled | default(false) | bool)
        fail_msg: "Select reviewed targets, wheel/hash, inert configuration and change reference explicitly."
  tasks:
    - name: Create unprivileged worker system identity
      ansible.builtin.user:
        name: "{{ zabalack_runtime_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
    - name: Create package and protected configuration directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ zabalack_runtime_user }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ zabalack_root }}", owner: root, mode: '0755'}
        - {path: /etc/zabalack, owner: root, mode: '0750'}
        - {path: /var/lib/zabalack, owner: "{{ zabalack_runtime_user }}", mode: '0700'}
    - name: Stage wheel without fetching dependencies
      ansible.builtin.copy:
        src: "{{ zabalack_wheel_file }}"
        dest: "{{ zabalack_root }}/package.whl"
        mode: '0644'
    - name: Read staged hash
      ansible.builtin.stat:
        path: "{{ zabalack_root }}/package.whl"
        checksum_algorithm: sha256
      register: staged
    - name: Verify wheel digest
      ansible.builtin.assert:
        that: staged.stat.checksum == zabalack_wheel_sha256
    - name: Preserve valid wheel filename for pip
      ansible.builtin.copy:
        src: "{{ zabalack_root }}/package.whl"
        remote_src: true
        dest: "{{ zabalack_root }}/{{ zabalack_wheel_file | basename }}"
        mode: '0644'
    - name: Create isolated worker environment
      ansible.builtin.command:
        argv: ["{{ zabalack_python }}", -m, venv, "{{ zabalack_root }}/venv"]
        creates: "{{ zabalack_root }}/venv/bin/python"
    - name: Stage reviewed offline dependency wheelhouse
      ansible.builtin.copy:
        src: "{{ zabalack_wheelhouse }}/"
        dest: "{{ zabalack_root }}/wheelhouse/"
        owner: root
        group: root
        mode: '0644'
        directory_mode: '0755'
    - name: Stage exact runtime dependency lock
      ansible.builtin.copy:
        src: "{{ zabalack_runtime_lockfile }}"
        dest: "{{ zabalack_root }}/requirements-runtime.lock"
        mode: '0644'
    - name: Install locked worker dependencies from offline wheelhouse
      ansible.builtin.pip:
        requirements: "{{ zabalack_root }}/requirements-runtime.lock"
        executable: "{{ zabalack_root }}/venv/bin/pip"
        extra_args: "--no-index --find-links {{ zabalack_root }}/wheelhouse"
    - name: Install only the supplied integration wheel
      ansible.builtin.pip:
        name: "{{ zabalack_root }}/{{ zabalack_wheel_file | basename }}"
        executable: "{{ zabalack_root }}/venv/bin/pip"
        extra_args: --no-deps --no-index
    - name: Store reviewed inert config containing secret references only
      ansible.builtin.copy:
        content: "{{ zabalack_shadow_config | to_nice_json }}\n"
        dest: /etc/zabalack/config.json
        owner: root
        group: "{{ zabalack_runtime_user }}"
        mode: '0640'
      no_log: true
    - name: Validate configuration without contacting endpoints
      ansible.builtin.command:
        argv: ["{{ zabalack_root }}/venv/bin/zabalack", --config, /etc/zabalack/config.json, config-check]
      changed_when: false
    - name: Copy service unit without daemon reload, start or boot enablement
      ansible.builtin.copy:
        src: ../systemd/zabalack-worker.service
        dest: /etc/systemd/system/zabalack-worker.service
        owner: root
        group: root
        mode: '0644'
      when: zabalack_root == '/opt/zabalack' and zabalack_runtime_user == 'zabalack'
    - name: Require reviewed unit when custom paths or identity are selected
      ansible.builtin.assert:
        that: zabalack_custom_unit_reviewed | default(false) | bool
      when: zabalack_root != '/opt/zabalack' or zabalack_runtime_user != 'zabalack'
# Exact pinned dependencies come only from the reviewed local wheelhouse.
# No application config/PLUGINS is overwritten.
# Alerta runtime wheel installation and node drain/restart are separate steps.
