---
- name: Separately authorised trigger installation
  hosts: "{{ zabalack_database_group | default('__zabalack_no_hosts_selected__') }}"
  gather_facts: false
  serial: 1
  vars:
    zabalack_trigger_opt_in: false
  pre_tasks:
    - ansible.builtin.assert:
        that:
          - zabalack_trigger_opt_in | bool
          - zabalack_database_group is defined
          - zabalack_change_ref | default('') | length > 0
          - zabalack_paths_fenced | default(false) | bool
          - zabalack_trigger_installer_service is defined
          - zabalack_trigger_script is defined
        fail_msg: "Trigger installation requires separate owner-authority connection and fenced paths."
  tasks:
    - name: Attach reviewed trigger using a distinct installation principal
      ansible.builtin.command:
        argv: [psql, -X, --no-password, --set, ON_ERROR_STOP=1, --dbname, "service={{ zabalack_trigger_installer_service }}", --file, "{{ zabalack_trigger_script }}"]
      no_log: true
# zabalack_trigger_script must be the reviewed sql/install/10_trigger.sql artifact.
# CONNECT via libpq service and protected credential reference; no token in argv.
# No flag bypass, physical trigger disable, worker start or automatic source writes.
