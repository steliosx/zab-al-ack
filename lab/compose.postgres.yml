# Native real PostgreSQL 18 reference server; explicit lab start only.
# python tools/native_ci.py --isolated-lab
# Host access uses owned loopback relays; no Docker port publishing on internal networks.
name: zabalack-postgres-lab
services:
  postgres:
    image: postgres:18.0-bookworm
    environment:
      POSTGRES_DB: alerta
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: synthetic-postgres-lab-only
      POSTGRES_HOST_AUTH_METHOD: trust # isolated lab role tests only; never production
    volumes: [ack-lab-pg18:/var/lib/postgresql]
    networks: [isolated]
    healthcheck:
      # The image's temporary initialization server accepts Unix sockets only.
      # Wait for the final TCP server used by the native test clients.
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -p 5432 -U lab_admin -d alerta"]
      interval: 2s
      timeout: 2s
      retries: 30
    command: [postgres, -c, log_statement=none]
  pgbouncer:
    profiles: [pooling]
    build:
      context: ..
      dockerfile: lab/Dockerfile.pgbouncer
    networks: [isolated]
    depends_on:
      postgres: {condition: service_healthy}
networks:
  isolated:
    internal: true
volumes:
  ack-lab-pg18:
