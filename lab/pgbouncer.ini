; SYNTHETIC ISOLATED LAB ONLY. Never copy trust authentication to production.
[databases]
alerta = host=postgres port=5432 dbname=alerta

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp
auth_type = trust
auth_file = /etc/pgbouncer/users.txt
pool_mode = transaction
max_client_conn = 30
default_pool_size = 3
min_pool_size = 0
server_reset_query = DISCARD ALL
server_reset_query_always = 1
ignore_startup_parameters = extra_float_digits
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
admin_users = lab_admin
stats_users = lab_admin
pidfile = /tmp/pgbouncer.pid
