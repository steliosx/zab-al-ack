[mypy]
python_version = 3.12
files = src/zabalack/config.py, src/zabalack/crypto.py, src/zabalack/policy.py, src/zabalack/rpc.py
mypy_path = src
strict = True
show_error_codes = True
pretty = True
cache_dir = build/cache/mypy
# Start at configuration, signature, authority, and remote-call boundaries.
# Imports remain checked; extend the explicit file list as other modules mature.
follow_imports = normal
