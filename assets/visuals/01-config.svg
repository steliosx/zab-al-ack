<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="619" viewBox="0 0 1000 619" role="img" aria-labelledby="title desc"><title id="title">01 / Check the configuration</title><desc id="desc">Output illustration, not a UI screenshot. Start with the inert production example. Actual CLI output; selected redacted fields. No database or Zabbix connection. Valid configuration does not establish deployment readiness.</desc><rect width="100%" height="100%" rx="12" fill="#f4f7f9"/><text x="32" y="49" fill="#183345" font-family="Arial,sans-serif" font-weight="bold" font-size="25">Zab-al-ack<tspan fill="#b85c00">.</tspan></text><text x="968" y="47" text-anchor="end" fill="#78501c" font-family="Arial,sans-serif" font-size="14">0.1.0a11 · SYNTHETIC LAB</text><path d="M32 73H968" stroke="#cbd8e0"/><text x="32" y="116" fill="#183345" font-family="Arial,sans-serif" font-weight="bold" font-size="29">01 / Check the configuration</text><text x="32" y="147" fill="#456175" font-family="Arial,sans-serif" font-size="17">Start with the inert production example.</text><rect x="32" y="169" width="936" height="358" rx="8" fill="#172c3c"/><text x="54" y="197" fill="#afc6d5" font-family="Arial,sans-serif" font-size="13">OUTPUT ILLUSTRATION · OBSERVED VALUES · NOT A UI SCREENSHOT</text><text x="54" y="233" fill="#ffbf75" font-family="DejaVu Sans Mono,monospace" font-size="17" xml:space="preserve">$ zabalack --config config/production.example.json config-check</text><text x="54" y="267" fill="#f0f6fa" font-family="DejaVu Sans Mono,monospace" font-size="17" xml:space="preserve">{</text><text x="54" y="292" fill="#f0f6fa" font-family="DejaVu Sans Mono,monospace" font-size="17" xml:space="preserve">  &quot;valid&quot;: true,</text><text x="54" y="317" fill="#f0f6fa" font-family="DejaVu Sans Mono,monospace" font-size="17" xml:space="preserve">  &quot;configuration&quot;: {</text><text x="54" y="342" fill="#f0f6fa" font-family="DejaVu Sans Mono,monospace" font-size="17" xml:space="preserve">    &quot;enabled&quot;: false,</text><text x="54" y="367" fill="#f0f6fa" font-family="DejaVu Sans Mono,monospace" font-size="17" xml:space="preserve">    &quot;external_writes_enabled&quot;: false,</text><text x="54" y="392" fill="#f0f6fa" font-family="DejaVu Sans Mono,monospace" font-size="17" xml:space="preserve">    &quot;cohort_count&quot;: 0,</text><text x="54" y="417" fill="#f0f6fa" font-family="DejaVu Sans Mono,monospace" font-size="17" xml:space="preserve">    &quot;instance_count&quot;: 0</text><text x="54" y="442" fill="#f0f6fa" font-family="DejaVu Sans Mono,monospace" font-size="17" xml:space="preserve">  },</text><text x="54" y="467" fill="#f0f6fa" font-family="DejaVu Sans Mono,monospace" font-size="17" xml:space="preserve">  &quot;deployment_gates&quot;: &quot;NOT_VERIFIED&quot;</text><text x="54" y="492" fill="#f0f6fa" font-family="DejaVu Sans Mono,monospace" font-size="17" xml:space="preserve">}</text><text x="32" y="559" fill="#456175" font-family="Arial,sans-serif" font-size="14">Actual CLI output; selected redacted fields. No database or Zabbix connection. Valid configuration does not establish</text><text x="32" y="579" fill="#456175" font-family="Arial,sans-serif" font-size="14">deployment readiness.</text></svg>
