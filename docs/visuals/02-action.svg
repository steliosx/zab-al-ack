<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="594" viewBox="0 0 1000 594" role="img" aria-labelledby="title desc"><title id="title">02 / Acknowledge one alert</title><desc id="desc">Output illustration, not a UI screenshot. A human action enters through Alerta’s single-alert /action route. Real Alerta 9.1.0 + PostgreSQL 18.3 WASM; Flask test client, synthetic JWT, injected probe, SET ROLE and mock Zabbix. G1–G8 remain open.</desc><rect width="100%" height="100%" rx="12" fill="#f4f7f9"/><text x="32" y="49" fill="#183345" font-family="Arial,sans-serif" font-weight="bold" font-size="25">Zab-al-ack<tspan fill="#b85c00">.</tspan></text><text x="968" y="47" text-anchor="end" fill="#78501c" font-family="Arial,sans-serif" font-size="14">0.1.0a12 · SYNTHETIC LAB</text><path d="M32 73H968" stroke="#cbd8e0"/><text x="32" y="116" fill="#183345" font-family="Arial,sans-serif" font-weight="bold" font-size="29">02 / Acknowledge one alert</text><text x="32" y="147" fill="#456175" font-family="Arial,sans-serif" font-size="17">A human action enters through Alerta’s single-alert /action route.</text><rect x="32" y="169" width="936" height="333" rx="8" fill="#172c3c"/><text x="54" y="197" fill="#afc6d5" font-family="Arial,sans-serif" font-size="13">OUTPUT ILLUSTRATION · OBSERVED VALUES · NOT A UI SCREENSHOT</text><text x="54" y="233" fill="#ffbf75" font-family="DejaVu Sans Mono,monospace" font-size="17" xml:space="preserve">PUT /alert/ba0eb500-eb92-4c7e-b154-81ca3f8f479d/action</text><text x="54" y="258" fill="#ffbf75" font-family="DejaVu Sans Mono,monospace" font-size="17" xml:space="preserve">{</text><text x="54" y="283" fill="#ffbf75" font-family="DejaVu Sans Mono,monospace" font-size="17" xml:space="preserve">  &quot;action&quot;: &quot;ack&quot;,</text><text x="54" y="308" fill="#ffbf75" font-family="DejaVu Sans Mono,monospace" font-size="17" xml:space="preserve">  &quot;text&quot;: &quot;Investigating this synthetic lab alert&quot;</text><text x="54" y="333" fill="