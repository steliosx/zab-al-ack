<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">One acknowledgement. One careful handoff.</title>
<desc id="diagram-description">Illustrative Zabalack alpha-design delivery overview for isolated evaluation. An authorised human acknowledges one eligible Alerta alert. PostgreSQL captures the signed intent in the same transaction as that acknowledgement. A worker verifies the intent before source access, then checks the original Zabbix problem and approved scope before any bounded acknowledgement. This is a scoped delivery overview, not a claim of production validation or guaranteed delivery.</desc>
